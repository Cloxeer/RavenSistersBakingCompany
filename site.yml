  title: How our drops work
  intro: We bake in limited batches from a home kitchen, so everything is made to
    order and always fresh. Drops open on Hotplate and usually sell out.
  steps:
    - title: The menu goes up
      description: We post the week's line-up on Hotplate and Instagram, and the order
        window opens.
    - title: Claim your order
      description: Order and pay through Hotplate — checkout is handled securely by Square.
    - title: Pickup or delivery
      description: We confirm the pickup window and delivery area for that drop, then
        bake it fresh that morning.
