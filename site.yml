privacy:
  title: Privacy Policy
  updated: Updated 2026
  body:
    - "Raven Sisters Baking Co. collects only the information needed to take and
      fulfil your order: your name, contact details, and what you ordered."
    - Orders and payments are handled by Hotplate, with card processing by
      Square. Your payment details are entered on their systems and are never
      seen or stored by us.
    - If you opt in to drop alerts, your phone number is used through Hotplate
      for that purpose only. You can turn alerts off at any time.
    - We do not sell or rent your personal information to anyone.
    - To ask what we hold about you, or to have it deleted, email
      crstice@gmail.com.
terms:
  title: Terms of Use
  updated: Updated 2026
  body:
    - Orders are placed through our Hotplate page and are confirmed once payment
      has been taken by Square.
    - Because every drop is baked to order in small batches, orders cannot be
      changed or cancelled once the drop closes and baking has been scheduled.
    - Pickup windows and delivery areas are set for each drop and are shared
      with your order confirmation. Orders not collected within the pickup
      window cannot be remade or refunded.
    - All of our baking happens in one home kitchen that handles wheat, dairy,
      eggs and nuts. We cannot guarantee that any item is free from cross
      contact with these allergens.
    - Menus, pricing and availability change with each drop and may be updated
      at any time.
    - Questions about these terms can be sent to crstice@gmail.com.
