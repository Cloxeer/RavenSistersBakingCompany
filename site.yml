story:
  title: Our story
  paragraphs:
    - Raven Sisters Baking Co. started the way most good bakeries do — baking
      far too much for friends and family, and never quite being able to stop.
    - "We are a home-based bakery in central New Mexico. Everything is made from
      scratch in small batches: bagels boiled and hand-rolled, breads given a
      long slow proof, and sweets baked the morning they go out."
    - Baking in drops keeps it that way. Instead of holding stock on a shelf, we
      bake exactly what has been ordered, so what you pick up is only ever hours
      old.
    - The long game is a storefront — a little coffee shop and tea house where
      the bakes come out of the oven all day, alongside a proper tea list and
      house-made kombucha. Every drop gets us closer.
  image: images/story.jpg
  imageAlt: Shaping dough by hand in the Raven Sisters kitchen
