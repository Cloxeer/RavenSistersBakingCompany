faq:
  title: Frequently asked
  items:
    - question: How do I order?
      answer: All orders go through our Hotplate page. When a drop opens you can
        browse the menu, claim what you want, and pay right there — checkout is
        processed securely by Square.
    - question: How do I know when the next drop is?
      answer: Turn on drop alerts on Hotplate and you will get a text as soon as the
        order window opens. We also post every drop on Instagram and Facebook.
    - question: Do you have a storefront I can visit?
      answer: Not yet. We bake from a home kitchen in central New Mexico, so there is
        no walk-in address. Pickup details are shared with your order
        confirmation for each drop.
    - question: Do you deliver?
      answer: Pickup and local delivery are both offered depending on the drop. The
        available options and the delivery area are listed on the drop when it
        opens.
    - question: Can I order for a party or a custom bake?
      answer: Yes — send us an email or a message on Instagram with the date and what
        you have in mind, and we will let you know what we can fit around the
        drop schedule.
    - question: Is everything really made from scratch?
      answer: Yes. Doughs are mixed, proofed, shaped and baked by hand in small
        batches. Nothing is par-baked or bought in.
    - question: What about allergens?
      answer: Everything is baked in one home kitchen that handles wheat, dairy, eggs
        and nuts, so we cannot guarantee any item is free from cross contact.
        Ask us before you order if you need specifics.
